<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ましましTODO</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    background: linear-gradient(135deg, #eef0ff 0%, #f5f6f8 45%, #eafaf0 100%);
    margin: 0;
    padding: 40px 16px;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 8px 28px rgba(60, 60, 120, 0.12);
    padding: 32px;
    width: 100%;
    max-width: 540px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
    color: #222;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .subtitle {
    font-size: 13px;
    color: #999;
    margin: 0 0 20px;
  }

  .progress-wrap {
    margin-bottom: 22px;
  }
  .progress-bar {
    height: 8px;
    background: #eee;
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #6b6bf0, #2a9d5c);
    border-radius: 999px;
    transition: width 0.4s ease;
    width: 0%;
  }
  .progress-label {
    font-size: 12px;
    color: #999;
    margin-top: 6px;
    text-align: right;
  }

  .input-row {
    display: flex;
    gap: 8px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    font-size: 15px;
    border: 1.5px solid #e0e0ec;
    border-radius: 10px;
    transition: border-color 0.15s;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: #6b6bf0;
  }
  button.add {
    background: linear-gradient(135deg, #6b6bf0, #4a4ae0);
    color: #fff;
    border: none;
    padding: 0 22px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.15s;
    box-shadow: 0 3px 10px rgba(74, 74, 224, 0.3);
  }
  button.add:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(74, 74, 224, 0.4); }
  button.add:active:not(:disabled) { transform: translateY(0); }
  button.add:disabled { background: #bbb; cursor: not-allowed; box-shadow: none; }

  ul.todo-list {
    list-style: none;
    padding: 0;
    margin: 24px 0 0;
  }
  li.todo-item {
    background: #fafaff;
    border: 1.5px solid #ececf7;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
    transition: all 0.25s ease;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  li.todo-item.done {
    background: linear-gradient(135deg, #f2fbf5, #eefaf1);
    border-color: #cdeed9;
  }
  .todo-main {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .checkbox-wrap {
    position: relative;
    width: 22px;
    height: 22px;
    flex-shrink: 0;
  }
  .checkbox-wrap input[type="checkbox"] {
    width: 22px;
    height: 22px;
    cursor: pointer;
    accent-color: #2a9d5c;
  }
  .todo-text {
    flex: 1;
    font-size: 15.5px;
    color: #222;
    font-weight: 500;
  }
  .todo-text.done-text {
    text-decoration: line-through;
    color: #999;
    font-weight: 400;
  }
  .delete-btn {
    background: none;
    border: none;
    color: #ccc;
    font-size: 18px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 6px;
    line-height: 1;
    transition: color 0.15s, background 0.15s;
    flex-shrink: 0;
  }
  .delete-btn:hover {
    color: #e05555;
    background: #fdeeee;
  }
  .cheer, .praise {
    margin-top: 8px;
    margin-left: 34px;
    font-size: 13px;
    padding: 4px 10px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    width: fit-content;
  }
  .cheer {
    color: #4a4ae0;
    background: #edecfd;
  }
  .praise {
    color: #218a4c;
    background: #e2f7ea;
  }
  .cheer .loading, .praise .loading {
    color: #aaa;
    font-style: italic;
  }
  .empty {
    color: #bbb;
    font-size: 14px;
    text-align: center;
    padding: 30px 0;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>✨ ましましTODO</h1>

    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">0 / 0 完了</div>
    </div>

    <div class="input-row">
      <input type="text" id="taskInput" placeholder="例: パンを買う">
      <button class="add" id="addBtn">追加</button>
    </div>
    <ul class="todo-list" id="todoList"></ul>
    <div class="empty" id="emptyMsg">まだタスクがありません</div>
  </div>

<script>
const taskInput = document.getElementById('taskInput');
const addBtn = document.getElementById('addBtn');
const todoList = document.getElementById('todoList');
const emptyMsg = document.getElementById('emptyMsg');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');

let todos = [];
let nextId = 1;

async function callAI(prompt) {
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 60,
      messages: [{ role: "user", content: prompt }]
    })
  });
  if (!response.ok) throw new Error("APIエラー: " + response.status);
  const data = await response.json();
  const text = (data.content || [])
    .filter(b => b.type === "text")
    .map(b => b.text)
    .join("")
    .trim();
  return text;
}

function updateProgress() {
  const total = todos.length;
  const done = todos.filter(t => t.done).length;
  const pct = total === 0 ? 0 : Math.round((done / total) * 100);
  progressFill.style.width = pct + '%';
  progressLabel.textContent = `${done} / ${total} 完了`;
}

function render() {
  todoList.innerHTML = '';
  emptyMsg.style.display = todos.length === 0 ? 'block' : 'none';
  updateProgress();

  todos.forEach(todo => {
    const li = document.createElement('li');
    li.className = 'todo-item' + (todo.done ? ' done' : '');

    const main = document.createElement('div');
    main.className = 'todo-main';

    const checkboxWrap = document.createElement('div');
    checkboxWrap.className = 'checkbox-wrap';
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = todo.done;
    checkbox.addEventListener('change', () => toggleDone(todo.id));
    checkboxWrap.appendChild(checkbox);

    const text = document.createElement('span');
    text.className = 'todo-text' + (todo.done ? ' done-text' : '');
    text.textContent = todo.text;

    main.appendChild(checkboxWrap);
    main.appendChild(text);

    if (todo.done) {
      const delBtn = document.createElement('button');
      delBtn.className = 'delete-btn';
      delBtn.textContent = '✕';
      delBtn.title = '削除';
      delBtn.addEventListener('click', () => deleteTask(todo.id));
      main.appendChild(delBtn);
    }

    li.appendChild(main);

    if (todo.cheerLoading) {
      const cheer = document.createElement('div');
      cheer.className = 'cheer';
      cheer.innerHTML = '<span class="loading">考え中...</span>';
      li.appendChild(cheer);
    } else if (todo.cheer) {
      const cheer = document.createElement('div');
      cheer.className = 'cheer';
      cheer.textContent = todo.cheer;
      li.appendChild(cheer);
    }

    if (todo.praiseLoading) {
      const praise = document.createElement('div');
      praise.className = 'praise';
      praise.innerHTML = '<span class="loading">考え中...</span>';
      li.appendChild(praise);
    } else if (todo.praise) {
      const praise = document.createElement('div');
      praise.className = 'praise';
      praise.textContent = todo.praise;
      li.appendChild(praise);
    }

    todoList.appendChild(li);
  });
}

async function addTask() {
  const text = taskInput.value.trim();
  if (!text) return;

  const todo = { id: nextId++, text, done: false, cheer: '', cheerLoading: true, praise: '', praiseLoading: false };
  todos.push(todo);
  taskInput.value = '';
  addBtn.disabled = true;
  render();

  try {
    const cheer = await callAI(
      `次のタスクに取り組む人へ、やる気が出る一言を日本語で15文字程度で1つだけ返してください。絵文字は0〜2個程度に控えめに使ってください。説明や鍵括弧は不要です。本文だけを返してください。タスク: 「${text}」`
    );
    todo.cheer = cheer;
  } catch (e) {
    todo.cheer = '応援コメント取得失敗';
  } finally {
    todo.cheerLoading = false;
    addBtn.disabled = false;
    render();
  }
}

async function toggleDone(id) {
  const todo = todos.find(t => t.id === id);
  if (!todo) return;

  todo.done = !todo.done;

  if (todo.done && !todo.praise) {
    todo.praiseLoading = true;
    render();
    try {
      const praise = await callAI(
        `次のタスクをやり遂げた人を、日本語で15文字程度で1つだけ絶賛してください。絵文字は0〜2個程度に控えめに使ってください。説明や鍵括弧は不要です。本文だけを返してください。タスク: 「${todo.text}」`
      );
      todo.praise = praise;
    } catch (e) {
      todo.praise = '称賛コメント取得失敗';
    } finally {
      todo.praiseLoading = false;
      render();
    }
  } else {
    render();
  }
}

function deleteTask(id) {
  todos = todos.filter(t => t.id !== id);
  render();
}

addBtn.addEventListener('click', addTask);
taskInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addTask();
});

render();
</script>
</body>
</html>
